# ======================================================================
# Cucumber / JUnit Platform execution settings
#
# Parallel execution is off by default: OLX is a live production site and
# hammering it from several browsers at once invites rate limiting. Turn it on
# for suites that target your own environments.
#
#   mvn test -Dcucumber.execution.parallel.enabled=true
# ======================================================================

cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Fail the build if a step is undefined or pending rather than reporting a pass.
cucumber.execution.strict=true

# Snippet style for any step that is not yet implemented.
cucumber.snippet-type=camelcase
